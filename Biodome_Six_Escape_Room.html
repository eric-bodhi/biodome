  --mt-ims:#3D2230; --mt-matrix:#6A2E45;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 12px 30px -16px rgba(0,0,0,.7);
  color-scheme: dark;
}

*,*::before,*::after{ box-sizing:border-box; }
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px); }
html,body{ margin:0; }
body{
  background:var(--glass); color:var(--ink);
  font-family:var(--body); font-size:1.0625rem; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
sub,sup{ font-size:.72em; line-height:0; }
button,input,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--o2); outline-offset:2px; border-radius:6px; }
[hidden]{ display:none !important; }
.visually-hidden{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.arrow{ font-family:var(--display); font-weight:700; }

/* ── Buttons ── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  min-height:46px; padding:.6rem 1.15rem; border-radius:999px;
  border:2px solid var(--ink); background:transparent; font-weight:700; letter-spacing:.01em;
}
.btn-primary{ background:var(--ink); color:var(--on-ink); }
.btn-primary:hover{ filter:brightness(1.15); }
.btn-ghost:hover{ background:var(--panel-2); }
.btn[disabled]{ opacity:.45; cursor:not-allowed; }
.linkish{ background:none; border:0; padding:0; text-decoration:underline; text-underline-offset:3px; color:var(--ink-2); font-weight:600; }

/* ── Start screen ── */
#start{ min-height:100%; display:grid; place-items:center; padding:2rem 1.25rem 3rem; }
.start-wrap{ width:min(1040px,100%); display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:2.5rem; align-items:center; }
.start-mark svg{ width:100%; height:auto; display:block; }
.wordmark{
  font-family:var(--display); font-weight:800; line-height:.86; letter-spacing:-.01em;
  font-size:clamp(4rem, 11vw, 8.6rem); margin:0 0 1rem;
}
.wordmark span{ display:block; }
.start-copy p{ max-width:34rem; margin:0 0 1rem; }
.start-copy .lede{ font-size:1.2rem; }
.start-form{ display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end; margin-top:1.5rem; }
.field label{ display:block; font-weight:700; font-size:.95rem; margin-bottom:.3rem; }
.field input{
  min-height:46px; width:min(18rem,80vw); padding:.55rem .8rem; border-radius:12px;
  border:2px solid var(--line); background:var(--panel);
}
.field input:focus{ border-color:var(--ink); outline:none; }
.start-foot{ margin-top:1.75rem; display:flex; gap:1.25rem; flex-wrap:wrap; font-size:.95rem; color:var(--ink-2); }

/* ── HUD ── */
.hud{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  display:flex; align-items:center; gap:1rem; flex-wrap:wrap;
  padding:.65rem clamp(1rem,3vw,2rem);
  background:color-mix(in srgb, var(--glass) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line-2);
}
body.in-game::before{
  content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:21;
  background:color-mix(in srgb, var(--glass) 88%, transparent); backdrop-filter:blur(10px);
}
.hud-brand{ font-family:var(--display); font-weight:800; font-size:1.6rem; line-height:1; margin-right:auto; }
.hud-stat{ display:flex; flex-direction:column; line-height:1.15; }
.hud-stat small{ color:var(--ink-2); font-size:.78rem; font-weight:600; }
.hud-stat b{ font-family:var(--display); font-size:1.45rem; font-weight:700; font-variant-numeric:tabular-nums; }
.meter{ width:120px; height:8px; border-radius:99px; background:var(--line-2); overflow:hidden; margin-top:4px; }
.meter i{ display:block; height:100%; background:var(--h2o); border-radius:99px; transition:width .4s ease, background .4s; }
.hud .btn{ min-height:40px; padding:.35rem .9rem; font-size:.95rem; }
.hud .sm{ display:none; }

/* ── Layout ── */
.layout{
  display:grid; grid-template-columns:300px minmax(0,1fr); gap:clamp(1.25rem,3vw,2.5rem);
  max-width:1180px; margin:0 auto; padding:1.5rem clamp(1rem,3vw,2rem) 4rem;
}
.dome{ position:sticky; top:96px; align-self:start; }
.dome svg{ width:100%; height:auto; display:block; }
.dome-caption{ font-size:.9rem; color:var(--ink-2); margin:.5rem .25rem 0; }

/* hex map */
.hex{ cursor:pointer; }
.hex polygon{ fill:var(--panel); stroke:var(--line); stroke-width:2; transition:fill .3s, stroke .3s; }
.hex text{ fill:var(--ink); }
.hex .hx-num{ font-family:var(--display); font-weight:800; font-size:32px; }
.hex .hx-name{ font-family:var(--body); font-weight:700; font-size:12.5px; }
.hex.locked{ cursor:not-allowed; }
.hex.locked polygon{ fill:var(--panel-2); stroke:var(--line-2); stroke-dasharray:5 4; }
.hex.locked text{ fill:var(--ink-2); opacity:.75; }
.hex.current polygon{ stroke:var(--rc); stroke-width:4; }
.hex.solved polygon{ fill:color-mix(in srgb, var(--rc) 24%, var(--panel)); stroke:var(--rc); }
.hex .hx-icon{ fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.hex:focus-visible{ outline:none; }
.hex:focus-visible polygon{ stroke:var(--o2); stroke-width:5; }
.hex.exit polygon{ fill:var(--panel-2); }
.hex.exit.open polygon{ fill:var(--ink); stroke:var(--ink); }
.hex.exit.open text{ fill:var(--on-ink); }
